[project]
name = "comfyui-videoframepicker"
description = "Load an MP4/AVI video, scrub to any frame inside the node (drag & drop supported) and output the visible frame as an IMAGE or save it as JPG/PNG. Shows video and frame metadata."
version = "0.2.2"
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "opencv-python-headless>=4.8",
    "numpy",
    "pillow",
]
classifiers = [
    "Operating System :: OS Independent",
]

[project.urls]
Repository = "https://github.com/Slartibart23/ComfyUI-VideoFramePicker"
Documentation = "https://github.com/Slartibart23/ComfyUI-VideoFramePicker#readme"
"Bug Tracker" = "https://github.com/Slartibart23/ComfyUI-VideoFramePicker/issues"

[tool.comfy]
PublisherId = "slartibart23b"
DisplayName = "Video Frame Picker"
Icon = ""
